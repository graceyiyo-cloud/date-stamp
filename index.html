<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工程紀錄拍攝工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #F5F5F0;
      color: #3C3C3C;
    }
    .btn-primary {
      background-color: #89938B;
      transition: background-color 0.2s ease;
    }
    .btn-primary:hover {
      background-color: #727B74;
    }
    .btn-secondary {
      background-color: #B2A59A;
      transition: background-color 0.2s ease;
    }
    .btn-secondary:hover {
      background-color: #9C9086;
    }
    input[type="radio"]:checked + div {
      background-color: #89938B;
      color: white;
      border-color: #89938B;
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

  <div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col gap-6 h-fit">
    
    <!-- 標題 -->
    <header class="flex items-center gap-2 border-b border-gray-100 pb-4">
      <i data-lucide="camera" class="w-6 h-6 text-[#89938B]"></i>
      <h1 class="text-xl font-bold text-gray-800">現場拍攝紀錄</h1>
    </header>

    <!-- 狀態選擇 (洗前/洗後) -->
    <div class="flex flex-col gap-2">
      <label class="font-medium text-sm text-gray-600">紀錄階段</label>
      <div class="flex gap-4">
        <label class="cursor-pointer flex-1">
          <input type="radio" name="status" value="洗前" class="hidden" checked>
          <div class="text-center py-2 border border-gray-300 rounded-lg text-gray-600 font-medium hover:bg-gray-50 transition-colors">
            洗前
          </div>
        </label>
        <label class="cursor-pointer flex-1">
          <input type="radio" name="status" value="洗後" class="hidden">
          <div class="text-center py-2 border border-gray-300 rounded-lg text-gray-600 font-medium hover:bg-gray-50 transition-colors">
            洗後
          </div>
        </label>
      </div>
    </div>

    <!-- 地點輸入 -->
    <div class="flex flex-col gap-2">
      <label for="locationInput" class="font-medium text-sm text-gray-600">拍攝地點</label>
      <div class="relative">
        <i data-lucide="map-pin" class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="locationInput" placeholder="請輸入或選擇地點" 
               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#89938B] focus:border-transparent w-full box-border">
      </div>
    </div>

    <!-- 時間顯示 (自動抓取民國年) -->
    <div class="flex flex-col gap-2">
      <label class="font-medium text-sm text-gray-600">拍攝時間</label>
      <div class="flex items-center gap-2 text-gray-700 bg-gray-50 p-2 rounded-lg border border-gray-100">
        <i data-lucide="clock" class="w-5 h-5 text-gray-400"></i>
        <span id="currentTimeDisplay" class="text-sm">載入中...</span>
      </div>
    </div>

    <!-- 拍攝與圖片預覽區 -->
    <div class="flex flex-col gap-4 mt-2">
      <label for="cameraInput" class="btn-primary text-white text-center py-3 rounded-lg cursor-pointer flex items-center justify-center gap-2 shadow-sm w-full">
        <i data-lucide="aperture" class="w-5 h-5"></i>
        <span>開啟相機拍攝</span>
      </label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

      <!-- 隱藏的 Canvas 用來合成圖片 -->
      <canvas id="photoCanvas" class="hidden"></canvas>
      
      <!-- 預覽圖 -->
      <div id="previewContainer" class="hidden flex-col gap-4">
        <img id="imagePreview" class="w-full rounded-lg shadow-sm border border-gray-200" alt="拍攝預覽">
        <button id="downloadBtn" class="btn-secondary text-white text-center py-3 rounded-lg flex items-center justify-center gap-2 shadow-sm w-full">
          <i data-lucide="download" class="w-5 h-5"></i>
          <span>儲存合成照片至手機</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    // 初始化圖示
    lucide.createIcons();

    // 時間處理：獲取當前民國年時間
    function getRocTimeString() {
      const now = new Date();
      const rocYear = now.getFullYear() - 1911;
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return `民國${rocYear}年${month}月${date}日 ${hours}:${minutes}`;
    }

    // 更新畫面時間顯示
    const timeDisplay = document.getElementById('currentTimeDisplay');
    timeDisplay.textContent = getRocTimeString();
    
    // 每分鐘更新一次時間顯示
    setInterval(() => {
      timeDisplay.textContent = getRocTimeString();
    }, 60000);

    const cameraInput = document.getElementById('cameraInput');
    const photoCanvas = document.getElementById('photoCanvas');
    const ctx = photoCanvas.getContext('2d');
    const imagePreview = document.getElementById('imagePreview');
    const previewContainer = document.getElementById('previewContainer');
    const downloadBtn = document.getElementById('downloadBtn');
    
    let currentImageObj = null;

    // 處理照片上傳/拍攝
    cameraInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          currentImageObj = img;
          processAndPreviewImage();
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(file);
    });

    // 將資料繪製到 Canvas 並產生預覽
    function processAndPreviewImage() {
      if (!currentImageObj) return;

      // 設定 Canvas 尺寸為原圖大小
      photoCanvas.width = currentImageObj.width;
      photoCanvas.height = currentImageObj.height;

      // 繪製原圖
      ctx.drawImage(currentImageObj, 0, 0);

      // 取得使用者輸入的資料
      const locationInfo = document.getElementById('locationInput').value || '未填寫地點';
      const timeInfo = getRocTimeString();
      const statusInfo = document.querySelector('input[name="status"]:checked').value;

      // 設定浮水印樣式（自適應照片大小）
      const fontSize = Math.max(photoCanvas.height * 0.03, 24);
      ctx.font = `bold ${fontSize}px "Noto Sans TC", sans-serif`;
      
      // 繪製半透明黑色背景底色，讓文字更清楚
      const padding = fontSize * 0.5;
      const textX = padding * 2;
      const textY = photoCanvas.height - (fontSize * 4) - padding * 2;
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(0, textY - padding, photoCanvas.width, (fontSize * 4.5) + padding * 2);

      // 繪製文字
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(`階段：${statusInfo}`, textX, textY + fontSize);
      ctx.fillText(`地點：${locationInfo}`, textX, textY + (fontSize * 2.5));
      ctx.fillText(`時間：${timeInfo}`, textX, textY + (fontSize * 4));

      // 將 Canvas 轉換為圖片顯示在畫面上
      imagePreview.src = photoCanvas.toDataURL('image/jpeg', 0.9);
      previewContainer.classList.remove('hidden');
      previewContainer.classList.add('flex');
    }

    // 監聽輸入改變時，如果已經有照片就重新渲染浮水印
    document.getElementById('locationInput').addEventListener('input', () => {
      if (currentImageObj) processAndPreviewImage();
    });
    const radios = document.querySelectorAll('input[name="status"]');
    radios.forEach(radio => {
      radio.addEventListener('change', () => {
        if (currentImageObj) processAndPreviewImage();
      });
    });

    // 下載圖片
    downloadBtn.addEventListener('click', () => {
      const dataURL = photoCanvas.toDataURL('image/jpeg', 0.9);
      const link = document.createElement('a');
      link.download = `現場紀錄_${getRocTimeString().replace(/\s/g, '_')}.jpg`;
      link.href = dataURL;
      link.click();
    });
  </script>
</body>
</html>
