<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工程紀錄相機</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      /* 基礎色系 */
      --bg-base: #f0f2f0;
      --text-main: #4a5553;
      /* 狀態專屬辨識色 (莫蘭迪色系) */
      --color-before: #a67c76; /* 洗前：粉褐 */
      --color-after: #6b8e85;  /* 洗後：藍綠 */
    }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-style: normal;
      background-color: var(--bg-base);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }
    /* 隱藏預設捲軸讓畫面更乾淨 */
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    
    /* 自訂縮放滑桿樣式 */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      margin-top: -6px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 2px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col max-w-md mx-auto p-4 gap-4 pb-24">

  <!-- 設定區塊 -->
  <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col gap-4">
    <div>
      <label class="block text-sm font-medium mb-2">拍攝地點</label>
      <div class="flex flex-col gap-2">
        <!-- 1. 地址輸入 -->
        <div class="relative">
          <i data-lucide="map-pin" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#8b9693]"></i>
          <input type="text" id="addressInput" placeholder="輸入地址 (例如：幸福家湖美店)" autocomplete="off"
                 class="w-full bg-[#f0f2f0] border-none rounded-lg py-3 pl-10 pr-4 text-base focus:outline-none focus:ring-2 focus:ring-[#8b9693] transition-all">
        </div>
        
        <!-- 2. 樓層選擇 (直接展開) -->
        <div class="grid grid-cols-5 gap-2">
          <label class="cursor-pointer">
            <input type="radio" name="floor" value="1F" class="peer hidden">
            <div class="text-center py-2 border border-[#e2e5e4] rounded-lg text-[#4a5553] text-sm font-medium peer-checked:bg-[#8b9693] peer-checked:text-white transition-colors">1F</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="floor" value="2F" class="peer hidden">
            <div class="text-center py-2 border border-[#e2e5e4] rounded-lg text-[#4a5553] text-sm font-medium peer-checked:bg-[#8b9693] peer-checked:text-white transition-colors">2F</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="floor" value="3F" class="peer hidden">
            <div class="text-center py-2 border border-[#e2e5e4] rounded-lg text-[#4a5553] text-sm font-medium peer-checked:bg-[#8b9693] peer-checked:text-white transition-colors">3F</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="floor" value="4F" class="peer hidden">
            <div class="text-center py-2 border border-[#e2e5e4] rounded-lg text-[#4a5553] text-sm font-medium peer-checked:bg-[#8b9693] peer-checked:text-white transition-colors">4F</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="floor" value="5F" class="peer hidden">
            <div class="text-center py-2 border border-[#e2e5e4] rounded-lg text-[#4a5553] text-sm font-medium peer-checked:bg-[#8b9693] peer-checked:text-white transition-colors">5F</div>
          </label>
        </div>

        <!-- 3. 位置輸入 -->
        <div class="relative">
          <i data-lucide="navigation" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#8b9693]"></i>
          <input type="text" id="positionInput" placeholder="輸入位置 (例如：前)" autocomplete="off"
                 class="w-full bg-[#f0f2f0] border-none rounded-lg py-3 pl-10 pr-4 text-base focus:outline-none focus:ring-2 focus:ring-[#8b9693] transition-all">
        </div>
      </div>
    </div>
    
    <div>
      <label class="block text-sm font-medium mb-1">工程狀態</label>
      <div class="flex gap-2">
        <button id="btnBefore" onclick="setStatus('洗前')" class="flex-1 py-3 rounded-lg text-white font-medium transition-all bg-[#a67c76] shadow-md">
          洗前
        </button>
        <button id="btnAfter" onclick="setStatus('洗後')" class="flex-1 py-3 rounded-lg text-[#4a5553] font-medium transition-all bg-[#e2e5e4]">
          洗後
        </button>
      </div>
    </div>
  </div>

  <!-- 相機預覽區塊 -->
  <div class="relative w-full aspect-[3/4] bg-black rounded-xl overflow-hidden shadow-sm flex-shrink-0">
    <div id="cameraStatus" class="absolute inset-0 flex items-center justify-center text-white text-sm z-10">
      載入相機中...
    </div>
    <video id="cameraFeed" class="absolute inset-0 w-full h-full object-cover z-20" autoplay playsinline></video>
    
    <!-- 網頁原生閃光燈開關 (若硬體支援網頁控制才會顯示於右上角) -->
    <button id="flashBtn" onclick="toggleFlash()" class="hidden absolute top-4 right-4 w-10 h-10 bg-black/40 backdrop-blur-sm rounded-full items-center justify-center z-30 text-white border border-white/30 transition-colors">
      <i data-lucide="zap" class="w-5 h-5"></i>
    </button>

    <!-- 縮放控制 (若硬體支援則顯示) -->
    <div id="zoomContainer" class="hidden absolute bottom-44 left-1/2 -translate-x-1/2 w-3/4 bg-black/40 backdrop-blur-sm px-4 py-3 rounded-full items-center gap-3 z-30 border border-white/30">
      <i data-lucide="zoom-out" class="w-4 h-4 text-white flex-shrink-0"></i>
      <input type="range" id="zoomSlider" oninput="handleZoom(event)" class="w-full">
      <i data-lucide="zoom-in" class="w-4 h-4 text-white flex-shrink-0"></i>
    </div>

    <!-- 一般連拍快門 (中央) -->
    <button id="captureBtn" onclick="takePhoto()" 
            class="absolute bottom-20 left-1/2 -translate-x-1/2 w-16 h-16 bg-white/90 backdrop-blur-sm rounded-full border-4 border-white flex items-center justify-center z-30 shadow-xl active:scale-95 transition-all">
      <i data-lucide="camera" class="w-7 h-7 text-[#4a5553]"></i>
    </button>

    <!-- 【新增】手機原生相機備用方案 (右下角，確保一定能開閃光燈) -->
    <label for="nativeCameraInput" class="absolute bottom-20 right-4 w-14 h-14 bg-black/50 backdrop-blur-sm rounded-full flex flex-col items-center justify-center z-30 text-white border border-white/40 shadow-lg cursor-pointer active:scale-95 transition-all">
      <i data-lucide="zap" class="w-5 h-5 text-yellow-300"></i>
      <span class="text-[9px] mt-1 font-medium">需閃光</span>
    </label>
    <input type="file" id="nativeCameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleNativePhoto(event)">
  </div>

  <!-- 拍攝歷史紀錄 -->
  <div class="flex-1 bg-white p-4 rounded-xl shadow-sm overflow-y-auto">
    <div class="flex items-center gap-2 mb-3 text-sm font-medium text-[#8b9693]">
      <i data-lucide="image" class="w-4 h-4"></i>
      <span>本次拍攝紀錄 (已自動下載至手機)</span>
    </div>
    <div id="gallery" class="grid grid-cols-3 gap-2">
      <!-- 縮圖會產生在這裡 -->
    </div>
  </div>

  <!-- 隱藏的 Canvas 用於合成影像 -->
  <canvas id="canvas" class="hidden"></canvas>

  <script>
    lucide.createIcons();

    let currentStatus = '洗前';
    let videoTrack = null;
    let isFlashOn = false;
    
    const video = document.getElementById('cameraFeed');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cameraStatus = document.getElementById('cameraStatus');

    window.addEventListener('load', () => {
      document.getElementById('addressInput').value = '';
      document.getElementById('positionInput').value = '';
      const checkedFloor = document.querySelector('input[name="floor"]:checked');
      if(checkedFloor) checkedFloor.checked = false;
      startCamera();
    });

    function setStatus(status) {
      currentStatus = status;
      const btnBefore = document.getElementById('btnBefore');
      const btnAfter = document.getElementById('btnAfter');
      
      if (status === '洗前') {
        btnBefore.className = 'flex-1 py-3 rounded-lg text-white font-medium transition-all bg-[#a67c76] shadow-md';
        btnAfter.className = 'flex-1 py-3 rounded-lg text-[#4a5553] font-medium transition-all bg-[#e2e5e4]';
      } else {
        btnBefore.className = 'flex-1 py-3 rounded-lg text-[#4a5553] font-medium transition-all bg-[#e2e5e4]';
        btnAfter.className = 'flex-1 py-3 rounded-lg text-white font-medium transition-all bg-[#6b8e85] shadow-md';
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        
        video.onloadedmetadata = () => {
          cameraStatus.style.display = 'none';
          checkCameraCapabilities(); 
        };
      } catch (err) {
        console.error("相機存取失敗:", err);
        cameraStatus.textContent = "無法存取相機，請確認瀏覽器權限。";
      }
    }

    function checkCameraCapabilities() {
      if (!videoTrack) return;
      setTimeout(() => {
        try {
          const capabilities = videoTrack.getCapabilities();
          
          const flashBtn = document.getElementById('flashBtn');
          if (capabilities.torch) {
            flashBtn.classList.remove('hidden');
            flashBtn.classList.add('flex');
          }

          const zoomContainer = document.getElementById('zoomContainer');
          const zoomSlider = document.getElementById('zoomSlider');
          if (capabilities.zoom) {
            zoomContainer.classList.remove('hidden');
            zoomContainer.classList.add('flex');
            zoomSlider.min = capabilities.zoom.min;
            zoomSlider.max = capabilities.zoom.max;
            zoomSlider.step = capabilities.zoom.step;
            zoomSlider.value = capabilities.zoom.min;
          }
        } catch (e) {
          console.warn("無法取得相機進階功能", e);
        }
      }, 500);
    }

    async function toggleFlash() {
      if (!videoTrack) return;
      isFlashOn = !isFlashOn;
      try {
        await videoTrack.applyConstraints({
          advanced: [{ torch: isFlashOn }]
        });
        const flashBtn = document.getElementById('flashBtn');
        if (isFlashOn) {
          flashBtn.className = 'absolute top-4 right-4 w-10 h-10 bg-white rounded-full flex items-center justify-center z-30 text-[#4a5553] shadow-md transition-colors';
          flashBtn.innerHTML = '<i data-lucide="zap-off" class="w-5 h-5"></i>';
        } else {
          flashBtn.className = 'absolute top-4 right-4 w-10 h-10 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center z-30 text-white border border-white/30 transition-colors';
          flashBtn.innerHTML = '<i data-lucide="zap" class="w-5 h-5"></i>';
        }
        lucide.createIcons();
      } catch (err) {
        console.error('閃光燈切換失敗:', err);
      }
    }

    async function handleZoom(e) {
      if (!videoTrack) return;
      try {
        await videoTrack.applyConstraints({
          advanced: [{ zoom: parseFloat(e.target.value) }]
        });
      } catch (err) {
        console.error('縮放失敗:', err);
      }
    }

    function getROCTimeString() {
      const now = new Date();
      const rocYear = now.getFullYear() - 1911;
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return `民國${rocYear}年${month}月${date}日 ${hours}:${minutes}`;
    }

    // 核心浮水印繪製與下載功能 (給兩種拍攝方式共用)
    function processAndDownloadImage(sourceCanvas) {
      const address = document.getElementById('addressInput').value.trim();
      const floorInput = document.querySelector('input[name="floor"]:checked');
      const floor = floorInput ? floorInput.value : '';
      const position = document.getElementById('positionInput').value.trim();
      
      const location = [address, floor, position].filter(Boolean).join(' ') || '未指定地點';
      const timeStr = getROCTimeString();

      const fontSize = Math.max(Math.floor(sourceCanvas.width * 0.035), 24);
      const padding = fontSize;
      const lineHeight = fontSize * 1.4;
      
      const textLines = [
        `狀態：${currentStatus}`,
        `地點：${location}`,
        `時間：${timeStr}`
      ];

      ctx.font = `bold ${fontSize}px sans-serif`;
      let maxWidth = 0;
      textLines.forEach(line => {
        const width = ctx.measureText(line).width;
        if (width > maxWidth) maxWidth = width;
      });

      const boxWidth = maxWidth + (padding * 2);
      const boxHeight = (textLines.length * lineHeight) + padding;
      const startX = padding;
      const startY = sourceCanvas.height - boxHeight - padding;

      if (currentStatus === '洗前') {
        ctx.fillStyle = 'rgba(166, 124, 118, 0.85)';
      } else {
        ctx.fillStyle = 'rgba(107, 142, 133, 0.85)';
      }
      
      ctx.beginPath();
      ctx.roundRect(startX, startY, boxWidth, boxHeight, 12);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.textBaseline = 'top';
      textLines.forEach((line, index) => {
        ctx.fillText(line, startX + padding, startY + (padding/2) + (index * lineHeight) + 4);
      });

      const photoDataUrl = sourceCanvas.toDataURL('image/jpeg', 0.9);
      const baseTime = timeStr.replace(/[\s:]/g, '');
      const uniqueMs = String(new Date().getMilliseconds()).padStart(3, '0');
      const uniqueFileName = `${baseTime}_${uniqueMs}`;

      downloadAndDisplay(photoDataUrl, currentStatus, uniqueFileName);
    }

    // 方法A：網頁極速連拍
    function takePhoto() {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      processAndDownloadImage(canvas);
    }

    // 方法B：呼叫原生相機拍攝 (處理回傳的相片)
    function handleNativePhoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          processAndDownloadImage(canvas);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = ''; // 清空欄位以便可以重複拍攝
    }

    function downloadAndDisplay(dataUrl, status, uniqueFileName) {
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `工程紀錄_${status}_${uniqueFileName}.jpg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      const gallery = document.getElementById('gallery');
      const imgWrapper = document.createElement('div');
      imgWrapper.className = 'aspect-square rounded-md overflow-hidden border border-[#e2e5e4] shadow-sm relative';
      
      const img = document.createElement('img');
      img.src = dataUrl;
      img.className = 'w-full h-full object-cover';
      
      const badgeColor = status === '洗前' ? 'bg-[#a67c76]' : 'bg-[#6b8e85]';
      const badge = document.createElement('div');
      badge.className = `absolute bottom-0 left-0 right-0 ${badgeColor} text-white text-[12px] py-1 text-center font-medium`;
      badge.textContent = status;

      imgWrapper.appendChild(img);
      imgWrapper.appendChild(badge);
      
      gallery.insertBefore(imgWrapper, gallery.firstChild);
    }
  </script>
</body>
</html>
